<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <div class="light blueLight"></div>
        <div class="light pinkLight"></div>
        
        <div class="visor">0</div>
    
    <div class="containerNum">
        <div>
            <button>AC</button>
            <button>&lt;</button>
            <button>%</button>
            <button>+</button>
        </div>
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>&times;</button>
        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>&divide;</button>
        </div>
        <div>
            <button>&diamondsuit;</button>
            <button>0</button>
            <button>.</button>
            <button>=</button>
        </div>
    </div>
    <div class="specialButtons">
        <div class="blueLine"></div>
        <div class="rowB">  
            <button>&radic;</button>
            <button>X<sup>y</sup></button>
            <button>$-R$</button>
            <button>€</button>
        </div>
    </div>
</div>


<script src="script.js"></script>
</body>
</html>
